[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chondrotwin"
version = "0.2.0"
description = "Minimal computable models of chondrocyte fate: the SOX9-RUNX2 toggle switch, the IHH-PTHrP growth-plate loop, a Boolean fate network, Langevin quasi-potential landscapes, a biphasic cartilage model, a toy digital-twin loop and a multi-agent cartilage model (one agent = one chondrocyte) - CHONDRO-TWIN."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Author One"}, {name = "Author Two"}, {name = "Author Three"}]
keywords = ["chondrocyte", "osteoarthritis", "mechanotransduction", "Waddington landscape", "digital twin", "systems biology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.22", "scipy>=1.9", "pandas>=1.5"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Repository = "https://github.com/<org>/chondrotwin"

[tool.setuptools.packages.find]
include = ["chondrotwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
